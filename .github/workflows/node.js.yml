# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize] #A esto se les llama actividades, en este caso responde a cuando se abre una PR y cuando se agregan commits a la PR.


#Cada job se ejecuta en un entorno independiente. No importa si hay algun need, estos se ejecutan en su propio entorno, needs solo es el "como", no comparte automáticamente los archivos ni las dependencias instaladas.
jobs: #Dentro de aqui definimos que JOBS hay. Nota: Distintos JOBS pueden ejecutarse en paralelo, (A no ser que dependan uno del otro, ahi se necesita algo llamado "needs" dentro del JOB)
  build: #Es el identificador del JOB. En este caso lo llamamos build.
    #needs: lint <------#### ESTE NEEDS ES EL COMENTARIO DE ARRIBA, EN DADO CASO QUE DEPENDA DE OTRO JOB SE NECESITA EL NEEDS, ESTO OBVIAMENTE TIENE QUE IR ANTES DE ESTE PASO.
    runs-on: ubuntu-latest #Conocido como runner, es el entorno donde se ejecuta.

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps: #Contiene los pasos del trabajo y en el se define las acciones y comandos que se ejecutaran en el JOB. Normalmente si uno de estos falla ya no se ejecuta el siguiente, por ejemplo si el CI falla entonces el BUILD ya no se ejecuta y marca el trabajo como FALLIDO.

    #uses utiliza una acción existente (normalmente preparada por Github) y run ejecuta comandos de terminal en el entorno seleccionado.
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      #El bloque with proporciona los parámetros que necesita la acción.
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm' #Esto hace que en instalaciones de dependencias posteriores sean mas rapidas ya que se almacenan en cache.
        #IMPORTANTE: los runners (ENTORNOS) pueden ser diferentes, pero la caché persiste entre ejecuciones y se puede restaurar en otra máquina virtual ESTA CACHE LA ADMINISTRA GITHUB. Esa es precisamente su utilidad.
    - run: npm ci # Esto hace una instalacion limpia de dependencias, CI = Clean Installation
    - run: npm run build
    # - run: npm test
    # Esto se ejecuta cuando se mergea un PR, es decir, cuando se hace un merge a la rama main. Se puede usar para hacer despliegues o notificaciones.
  after-merge: # Asi se llama nuestro JOB, "after-merge".
    if: github.event.pull_request.merged == true # La propiedad if decide si se ejecuta o no el JOB, en este caso solo se ejecuta si la PR fue mergeada.
    runs-on: ubuntu-latest
    steps:
      - run: echo "El PR fue integrado"

#OPERADORES EN CONDICIONALES COMO && Y || funcionan en los IFS por ejemplo:
#if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#esto sifica que el JOB solo se ejecuta si el evento es un push y la rama es main. Nota: tambien podemos ponerlo en un STEP en especifico, por ejemplo si queremos que un paso solo se ejecute si el evento es un push y la rama es main, entonces pondriamos el if en ese paso.

